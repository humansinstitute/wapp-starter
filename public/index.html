<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline Chat WApp</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="login" id="login">
        <div>
          <h1>Pipeline Chat</h1>
          <p>Sign in with Nostr to start a local chat backed by a Wingmen pipeline webhook.</p>
        </div>
        <div class="loginActions">
          <button id="loginButton" type="button">Sign in with Extension</button>
          <details class="nsecLogin">
            <summary>Use nsec directly</summary>
            <label>
              <span>Private key</span>
              <input id="nsecInput" type="password" autocomplete="off" spellcheck="false" placeholder="nsec1..." />
            </label>
            <button id="nsecLoginButton" type="button">Sign in with nsec</button>
          </details>
        </div>
        <p class="error" id="loginError"></p>
      </section>

      <section class="home hidden" id="home">
        <div class="homeInner">
          <h1>What would you like to do today?</h1>
          <div class="homeActions">
            <button id="homeActButton" type="button">Act</button>
            <button id="homeChatButton" type="button">Chat</button>
            <button id="homeSettingsButton" type="button">Settings</button>
          </div>
        </div>
      </section>

      <section class="actPage hidden" id="actPage"></section>

      <section class="settingsPage hidden" id="settingsPage">
        <div class="settingsFrame">
          <header class="pageHeader">
            <h1>Settings</h1>
            <button id="settingsHomeButton" type="button">Home</button>
          </header>
          <section class="settingsGrid">
            <div class="settingsPanel">
              <h2>Autopilot</h2>
              <label>
                <span>Target</span>
                <select id="autopilotTargetSelect"></select>
              </label>
              <label>
                <span>Target label</span>
                <input id="autopilotLabelInput" type="text" placeholder="Rick local" />
              </label>
              <label>
                <span>Autopilot URL</span>
                <input id="autopilotUrlInput" type="url" placeholder="http://127.0.0.1:3256" />
              </label>
              <label>
                <span>Default pipeline</span>
                <select id="pipelineSelect"></select>
                <input id="pipelineInput" type="text" placeholder="chat-wapp-agent-response" />
              </label>
              <div class="settingsActions">
                <button id="loadPipelinesButton" type="button">Refresh Pipelines</button>
                <button id="saveSettingsButton" type="button">Save</button>
                <button id="newTargetButton" type="button">New Target</button>
                <button id="deleteTargetButton" type="button">Delete Target</button>
              </div>
            </div>
            <div class="settingsPanel">
              <h2>Access</h2>
              <label>
                <span>Npub</span>
                <input id="accessNpubInput" type="text" placeholder="npub1..." />
              </label>
              <label>
                <span>Role</span>
                <select id="accessRoleSelect">
                  <option value="read">Read</option>
                  <option value="edit">Edit</option>
                </select>
              </label>
              <button id="addAccessButton" type="button">Add access</button>
              <div id="accessList" class="accessList"></div>
            </div>
            <div class="settingsPanel widePanel">
              <h2>SQLite Reference DB</h2>
              <div class="dbMeta" id="dbMeta"></div>
              <label>
                <span>Snapshot note</span>
                <input id="snapshotNoteInput" type="text" placeholder="Before testing migration 004" />
              </label>
              <div class="settingsActions">
                <button id="refreshDbButton" type="button">Refresh DB</button>
                <button id="exportDbButton" type="button">Export Snapshot</button>
              </div>
              <label>
                <span>Import SQLite file</span>
                <input id="importDbInput" type="file" accept=".sqlite,.db,application/vnd.sqlite3,application/octet-stream" />
              </label>
              <div class="settingsActions">
                <button id="importDbButton" type="button">Stage Import</button>
                <button id="clearImportButton" type="button">Clear Pending</button>
              </div>
              <div id="snapshotList" class="snapshotList"></div>
            </div>
          </section>
        </div>
      </section>

      <section class="shell hidden" id="shell">
        <aside class="sidebar">
          <div class="sidebarTop">
            <div>
              <div class="eyebrow">Signed in</div>
              <div class="npub" id="npub"></div>
            </div>
            <button id="logoutButton" title="Sign out">Sign out</button>
          </div>
          <button class="newChat" id="newChatButton">New chat</button>
          <nav id="chatList" class="chatList"></nav>
        </aside>

        <section class="chatPane">
          <header class="chatHeader">
            <div>
              <h2 id="chatTitle">New chat</h2>
              <div class="runControls">
                <select id="chatAutopilotSelect" title="Autopilot target"></select>
                <select id="chatPipelineSelect" title="Pipeline"></select>
              </div>
            </div>
            <div class="status" id="status">Ready</div>
          </header>
          <div class="messages" id="messages"></div>
          <form class="composer" id="composer">
            <textarea id="messageInput" rows="1" placeholder="Send a message"></textarea>
            <button id="sendButton" type="submit">Send</button>
          </form>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
